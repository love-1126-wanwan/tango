<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="つながる単語帳">
<meta name="theme-color" content="#E6EEF5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111A24" media="(prefers-color-scheme: dark)">
<title>つながる単語帳</title>
<style>
:root{
  --bg:#E6EEF5; --paper:#FFFFFF; --ink:#1B2A3A; --sub:#5B6B7C; --blue:#2457A6; --on-blue:#FFFFFF;
  --blue-soft:#DCE7F6; --marker:#FFE45C; --marker-ink:#1B2A3A; --ok:#2E7D52; --ok-soft:#DDF0E4;
  --line:#CAD6E2; --ring:#9AA7B4; --danger:#B3261E;
  --en:"Avenir Next","Segoe UI","Helvetica Neue",Roboto,Arial,sans-serif;
  --ja:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo","Noto Sans JP",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111A24; --paper:#1B2634; --ink:#E6EDF5; --sub:#96A6B8; --blue:#8DB2EE; --on-blue:#0E1826;
    --blue-soft:#243650; --marker:#6B5A12; --marker-ink:#FFF4C2; --ok:#7CCB9C; --ok-soft:#1F3A2B;
    --line:#2E3D50; --ring:#5E6C7B; --danger:#F2A09A;
  }
}
:root[data-theme="dark"]{
  --bg:#111A24; --paper:#1B2634; --ink:#E6EDF5; --sub:#96A6B8; --blue:#8DB2EE; --on-blue:#0E1826;
  --blue-soft:#243650; --marker:#6B5A12; --marker-ink:#FFF4C2; --ok:#7CCB9C; --ok-soft:#1F3A2B;
  --line:#2E3D50; --ring:#5E6C7B; --danger:#F2A09A;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--ja);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible,[role=button]:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding:0 16px 104px;min-height:100%}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px;gap:12px}
h1{font-size:1.15rem;margin:0;font-weight:700;letter-spacing:.02em}
h2{font-size:1rem;margin:0 0 10px}
.speed{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px}
.speed button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:.82rem;color:var(--sub)}
.speed button[aria-pressed="true"]{background:var(--blue);color:var(--on-blue)}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav .inner{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{border:0;background:none;padding:10px 0 12px;font-size:.74rem;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button[aria-current="page"]{color:var(--blue);font-weight:700}

.bar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:.82rem;color:var(--sub)}
.chip[aria-pressed="true"]{border-color:var(--blue);color:var(--blue);background:var(--blue-soft);font-weight:700}
.chip:disabled{opacity:.45}
.count{font-family:var(--en);font-size:.85rem;color:var(--sub)}

/* ring-bound card */
.deck{position:relative;perspective:1400px;margin-top:22px}
.deck::before{content:"";position:absolute;inset:8px -6px -8px 6px;background:var(--paper);border:1px solid var(--line);border-radius:14px;opacity:.55}
.ring{position:absolute;left:22px;top:-22px;width:34px;height:52px;z-index:3;pointer-events:none}
.card{position:relative;width:100%;min-height:450px;cursor:pointer;border-radius:14px;
  transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.3,1)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;background:var(--paper);border:1px solid var(--line);border-radius:14px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:44px 22px 22px;display:flex;flex-direction:column;overflow:auto}
.face::before{content:"";position:absolute;left:30px;top:14px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.back{transform:rotateY(180deg)}
.front{align-items:center;justify-content:center;text-align:center}
.word{font-family:var(--en);font-weight:700;font-size:clamp(2.4rem,11vw,3.4rem);line-height:1.1;word-break:break-word}
.pos{margin-top:10px;color:var(--sub);font-size:.85rem}
.hint{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:.78rem;color:var(--sub)}
.status-tag{position:absolute;top:14px;right:16px;font-size:.75rem;padding:3px 9px;border-radius:999px;background:var(--ok-soft);color:var(--ok);font-weight:700}

.w-small{font-family:var(--en);font-weight:700;font-size:1.3rem}
.reading{font-size:2rem;font-weight:700;margin:4px 0 2px;letter-spacing:.04em;color:var(--blue)}
.ipa{margin:6px 0 12px}
.ipa-str{font-family:"Charis SIL","Doulos SIL","Lucida Sans Unicode","Segoe UI","Arial Unicode MS",sans-serif;font-size:1.15rem;color:var(--ink);letter-spacing:.02em}
.ipa-tiles{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:4px}
.ipa-tiles li{display:flex;flex-direction:column;align-items:center;min-width:38px;padding:5px 6px 4px;border-radius:8px;background:var(--blue-soft)}
.ipa-tiles li.mk{background:none;border:1px dashed var(--line)}
.ipa-tiles .sym{font-family:"Charis SIL","Doulos SIL","Lucida Sans Unicode","Segoe UI",sans-serif;font-size:1.1rem;line-height:1.2}
.ipa-tiles .kana{font-size:.66rem;color:var(--sub);white-space:nowrap;margin-top:2px}
.ipa-how{margin-top:8px}
.ipa-how summary{cursor:pointer;color:var(--blue);font-size:.85rem;font-weight:700;padding:4px 0}
.ipa-how ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.ipa-how li{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border-radius:10px;padding:8px 10px;font-size:.84rem;line-height:1.55}
.ipa-how li .sym{font-family:"Charis SIL","Doulos SIL","Lucida Sans Unicode","Segoe UI",sans-serif;font-size:1.15rem;min-width:30px;text-align:center}
.ipa-how li b{display:block;color:var(--blue)}
.meaning{font-size:1.05rem;margin:0 0 14px;line-height:1.6}
.meaning small{color:var(--sub);font-size:.8rem;margin-right:6px}
.sec{border-top:1px dashed var(--line);padding-top:14px;margin-top:4px}
.ex{font-family:var(--en);font-size:1.25rem;line-height:1.9;margin:0}
.ex mark{background:linear-gradient(transparent 38%,var(--marker) 38%,var(--marker) 92%,transparent 92%);color:var(--marker-ink);padding:0 2px;border-radius:2px}
.ex-reading{font-size:1.15rem;font-weight:700;margin:4px 0 2px;color:var(--blue);letter-spacing:.03em;word-break:break-all}
.ex-ja{color:var(--sub);font-size:.9rem;margin:2px 0 12px}
.links{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.links li{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:.88rem;line-height:1.6;display:flex;gap:6px;align-items:flex-start}
.links .body{flex:1}
.links .lk{font-family:var(--en);font-weight:600}
.links .arrow{color:var(--sub);margin:0 4px}
.links .lr{font-weight:700;color:var(--blue)}
.links .tip{display:block;color:var(--sub);font-size:.82rem;margin-top:2px}

.play{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--blue);background:var(--paper);color:var(--blue);border-radius:999px;padding:8px 14px;font-size:.85rem;font-weight:700}
.play svg{width:16px;height:16px}
.front .play{margin-top:22px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.icon{border:0;background:none;color:var(--sub);padding:6px;display:flex;flex:none}
.icon svg{width:20px;height:20px}

.judge{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.judge button{border-radius:12px;padding:14px 0;font-weight:700;font-size:1rem;border:1px solid var(--line);background:var(--paper)}
.judge .yes{background:var(--ok);border-color:var(--ok);color:var(--on-blue)}
.navbtns{display:flex;justify-content:space-between;margin-top:10px}
.navbtns button{border:0;background:none;color:var(--sub);padding:8px 4px;font-size:.88rem}
.navbtns button:disabled{opacity:.35}

.empty{background:var(--paper);border:1px dashed var(--line);border-radius:14px;padding:32px 22px;text-align:center;margin-top:24px}
.empty p{margin:0 0 16px;line-height:1.7;color:var(--sub)}
.primary{border:0;background:var(--blue);color:var(--on-blue);border-radius:12px;padding:13px 20px;font-weight:700;font-size:1rem}
.ghost{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 16px;font-weight:700}
.ghost.danger{color:var(--danger)}

.courses{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:12px 0 10px}
.ai-box{background:var(--paper);border:1px dashed var(--blue);border-radius:14px;padding:14px;margin:0 0 12px}
.ai-box p{margin:0 0 10px;font-size:.88rem;line-height:1.6;color:var(--sub)}
.ai-box .btns{display:flex;gap:8px;flex-wrap:wrap}
.ai-box .err{color:var(--danger)}
.ai-preview{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:var(--bg)}
.field{display:block;width:100%;font-family:var(--en);font-size:1rem;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:0 0 8px}
.ai-status{display:inline-block;font-size:.78rem;padding:2px 9px;border-radius:999px;margin-left:6px;vertical-align:middle}
.ai-status.on{background:var(--ok-soft);color:var(--ok)}
.ai-status.off{background:var(--bg);color:var(--sub)}
.notes{margin:0 0 12px;padding-left:1.2em;font-size:.84rem;line-height:1.7;color:var(--sub)}
.course{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.course b{font-size:.82rem}
.course span{font-size:.7rem;color:var(--sub);font-family:var(--en)}
.course[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.course[aria-pressed="true"] span{color:var(--blue)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tags i{font-style:normal;font-size:.68rem;color:var(--blue);border:1px solid var(--blue-soft);background:var(--blue-soft);border-radius:999px;padding:1px 7px}
input[type=search]{width:100%;font-family:var(--en);font-size:1.05rem;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);-webkit-appearance:none;appearance:none}
.bulk{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;font-size:.85rem;color:var(--sub)}
.bulk button{border:1px solid var(--blue);background:var(--paper);color:var(--blue);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:700;white-space:nowrap}
.bulk button:disabled{opacity:.4}

.list{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.list > li{background:var(--paper);border:1px solid var(--line);border-radius:12px}
.item{display:flex;align-items:center;gap:8px;padding:10px 12px}
details > summary{list-style:none}
details > summary::-webkit-details-marker{display:none}
summary.item{cursor:pointer}
.lw{flex:1;min-width:0}
.lw b{font-family:var(--en);font-size:1.1rem;display:block}
.lw span{color:var(--sub);font-size:.85rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details[open] .lw span{white-space:normal}
.detail{padding:4px 14px 14px}
.add{border:1px solid var(--blue);background:var(--paper);color:var(--blue);border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:700;white-space:nowrap;flex:none}
.add.added{border-color:var(--line);color:var(--sub);font-weight:400}
.tog{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 10px;font-size:.78rem;white-space:nowrap;flex:none}
.tog.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.summary{display:flex;gap:16px;color:var(--sub);font-size:.88rem;margin:4px 0 10px}
.summary b{color:var(--ink);font-family:var(--en)}
.more{display:block;margin:12px auto 0}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:12px}
.panel p{margin:0 0 12px;line-height:1.7;font-size:.9rem;color:var(--sub)}
.panel .btns{display:flex;gap:8px;flex-wrap:wrap}
.guide{margin:0;padding:0;list-style:none;display:grid;gap:10px;font-size:.9rem;line-height:1.6}
.guide b{color:var(--blue);font-size:1.05rem;margin-right:6px}
.codes{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:.86rem;line-height:1.6}
.codes li{background:var(--bg);border-radius:10px;padding:8px 12px}
.codes b{display:block}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:.88rem;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>つながる単語帳</h1>
    <div class="speed" role="group" aria-label="音声の速さ">
      <button type="button" data-rate="0.7" aria-pressed="false">ゆっくり</button>
      <button type="button" data-rate="1" aria-pressed="true">ふつう</button>
    </div>
  </header>
  <main id="view"></main>
</div>

<nav aria-label="メニュー"><div class="inner">
  <button type="button" data-tab="study" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><circle cx="8" cy="9" r="1.2"/><path d="M8 3v5"/></svg>カード</button>
  <button type="button" data-tab="find">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>さがす</button>
  <button type="button" data-tab="mine">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>単語帳</button>
  <button type="button" data-tab="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>設定</button>
</div></nav>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!--
  つながる単語帳 データ形式(追加するときの覚え書き)
  WORD_DATA の1行 = 1語:
  [英語, 品詞, 意味, 発音記号(米), 例文, 例文の訳, 例文の読み(つながった音),
   [[つながる部分, 読み, 型], ...], タグ(空白区切り), カタカナ上書き(通常は空)]
  型: L=くっつく F=ラ行化 D=飲み込む N=tが消える Y=チュ/ジュ化 G=1つにまとまる H=h/thが消える W=弱くなる
  タグ: jhs1 jhs2 jhs3 / hs1 hs2 hs3 / id1 id2 id3 / t500 t700 t900
  カタカナは発音記号から KANA.convert() で自動で作る。
-->
<script>
/* ===== 内蔵の単語データ ===== */
const WORD_DATA = [
/*DATA-START*/
["apple","名詞","りんご","ˈæpəl","I have an apple.","りんごを1個持っています。","アイハヴァナポー",[["an apple","アナポー","L"]],"jhs1",""],
["water","名詞","水","ˈwɑːt̬ɚ","Can I get some water?","お水をもらえますか?","キャナイゲッサムワーラー",[["Can I","キャナイ","L"],["get some","ゲッサム","D"],["water","ワーラー","F"]],"jhs1",""],
["book","名詞","本","bʊk","This is a good book.","これはいい本です。","ディスィザグッブック",[["This is a","ディスィザ","L"],["good book","グッブック","D"]],"jhs1",""],
["dog","名詞","犬","dɑːɡ","I have a dog.","犬を飼っています。","アイハヴァダーグ",[["have a","ハヴァ","L"]],"jhs1",""],
["cat","名詞","ねこ","kæt","My cat is cute.","うちのねこはかわいい。","マイキャリズキューッ",[["cat is","キャリズ","F"]],"jhs1",""],
["friend","名詞","友だち","frend","She is my best friend.","彼女は私の親友です。","シーズマイベスフレン",[["She is","シーズ","L"],["best friend","ベスフレン","D"]],"jhs1",""],
["family","名詞","家族","ˈfæməli","My family is big.","うちは大家族です。","マイファミリズビッグ",[["family is","ファミリズ","L"]],"jhs1",""],
["mother","名詞","母","ˈmʌðɚ","My mother is a nurse.","母は看護師です。","マイマザリザナース",[["mother is a","マザリザ","L"]],"jhs1",""],
["father","名詞","父","ˈfɑːðɚ","My father works at a bank.","父は銀行で働いています。","マイファーザーワークサラベァンク",[["works at a","ワークサラ","F"]],"jhs1",""],
["school","名詞","学校","skuːl","I walk to school.","歩いて学校に行きます。","アイウォークタスクーゥ",[["walk to","ウォークタ","W"]],"jhs1",""],
["teacher","名詞","先生","ˈtiːtʃɚ","Our teacher is kind.","私たちの先生はやさしい。","アウアティーチャリズカイン",[["teacher is","ティーチャリズ","L"]],"jhs1",""],
["student","名詞","生徒、学生","ˈstuːdənt","I am a student.","私は学生です。","アイマストゥーデン",[["I am a","アイマ","L"]],"jhs1",""],
["name","名詞","名前","neɪm","What is your name?","あなたの名前は何ですか?","ワッチュアネイム",[["What is your","ワッチュア","Y"]],"jhs1",""],
["day","名詞","日、1日","deɪ","Have a nice day!","よい1日を!","ハヴァナイスデイ",[["Have a","ハヴァ","L"]],"jhs1",""],
["time","名詞","時間、〜回","taɪm","What time is it?","今何時ですか?","ワッタイミズィッ",[["What time","ワッタイム","G"],["is it","イズィッ","L"]],"jhs1",""],
["morning","名詞","朝","ˈmɔːrnɪŋ","Good morning!","おはよう!","グッモーニン",[["Good morning","グッモーニン","D"]],"jhs1",""],
["night","名詞","夜","naɪt","Good night!","おやすみ!","グッナイ",[["Good night","グッナイ","D"]],"jhs1",""],
["house","名詞","家","haʊs","Come to my house.","うちに来てね。","カムタマイハウス",[["Come to","カムタ","W"]],"jhs1",""],
["room","名詞","部屋","ruːm","My room is small.","私の部屋はせまい。","マイルーミズスモーォ",[["room is","ルーミズ","L"]],"jhs1",""],
["car","名詞","車","kɑːr","Get in the car.","車に乗って。","ゲリンザカー",[["Get in","ゲリン","F"]],"jhs1",""],
["bus","名詞","バス","bʌs","I take a bus to school.","バスで通学しています。","アイテイカバスタスクーゥ",[["take a","テイカ","L"],["bus to","バスタ","W"]],"jhs1",""],

        const v=t[i+2], base=V[v][0]; let suf=suffix(v,i+2);
        out.push((YI[x]||C[x].i)+SMALL[base]+suf); i+=3; continue;
      }
      if(isV(nx) && C[x]){
        const base=V[nx][0]; let suf=suffix(nx,i+1); let kana;
        if(nx==="æ" && AE[x]){ kana=AE[x]; if(suf==="ァ") suf=""; } else kana=C[x][base];
        if(nx==="ə" && t[i+2]==="l" && (i+3===n || wb.has(i+3))){
          out.push(C[x].o+"ー"); i += isV(t[i+3]) ? 2 : 3; continue; }                  // apple → ポー, capable of → ケイパボーラヴ
        suf=gem(nx,i+1,suf);
        out.push(kana+suf); i+=2; continue;
      }
      // 子音だけ
      const last=out[out.length-1]||"";
      if(x==="r" && (last.endsWith("ー")||last.endsWith("ア"))){ i++; continue; }
      if(x==="l" && (nx===undefined || (!isV(nx) && nx!=="j"))){ out.push("ォ"); i++; continue; }
      if((x==="t"||x==="d") && nx==="r" && !wb.has(i+1)){ out.push(x==="t"?"チュ":"ジュ"); i++; continue; }
      if((x==="t"||x==="d") && nx===undefined){ out.push(x==="t"?"(ト)":"(ド)"); i++; continue; }
      if((x==="t"||x==="d") && !isV(nx)){
        if(prev && !isV(prev) && prev!=="r"){ i++; continue; }                           // friendly, next to
        if(nx==="w" && !bound.has(i+1)){ out.push(x==="t"?"トゥ":"ドゥ"); i++; continue; }  // between
        out.push("ッ"); i++; continue;                                                  // sit down, let me
      }
      if(STOPS.has(x) && nx===x){ out.push("ッ"); i++; continue; }                     // take care
      if(x==="ŋ" && isV(nx)){ out.push("ン"+C["ɡ"][V[nx][0]]+gem(nx,i+1,suffix(nx,i+1))); i+=2; continue; }  // singer → スィンガー
      if(x==="ŋ"){
        if(nx==="k"||nx==="ɡ"||nx==="g"){ out.push("ン"); i++; continue; }
        if(nx===undefined && prev==="ɪ"){                                              // morning → モーニン(2音節以上の語だけ)
          let st=0; for(const b of wb) if(b<=i && b>st) st=b;
          if(t.slice(st,i).filter(isV).length>=2){ out.push("ン"); i++; continue; }
        }
      }
      if(x==="m" && (nx==="p"||nx==="b"||nx==="f") && !wb.has(i+1)){ out.push("ン"); i++; continue; }
      out.push(ALONE[x]||""); i++;
    }
    return out.join("").replace(/ッ+/g,"ッ").replace(/ッ\(/g,"ッ(");
  }
  return { convert, tokens };
})();

<script>
(function(){

const TIPS = {
  L:"前の単語の終わりの子音と、次の単語の最初の母音がくっついて1つの音になる",
  F:"母音にはさまれた t や d が、軽い「ラ行」のような音になる",
  D:"最後の t・d・k・p などをほとんど言わず、飲み込むように止める",
  N:"n のあとの t がほぼ消える",
  Y:"t・d・s・z などと you / your がくっついて「チュ」「ジュ」「シュ」などに変わる",
  G:"同じような音が続くとき、1回分だけ発音する",

  ["d","ドゥ","t と同じ舌の位置で、声を出す","c"],
  ["k","ク","舌の奥を上あごにつけ、息を強く出す","c"],
  ["ɡ","グ","k と同じ舌の位置で、声を出す","c"],
  ["g","グ","k と同じ舌の位置で、声を出す","c"],

  ["ð","ズ(舌を出す)","θ と同じ舌の形で、声を出す","c"],
  ["s","ス","日本語の「ス」の子音だけ。母音の「ウ」を付けない","c"],
  ["z","ズ","s と同じ形で、声を出す","c"],

  ["ʒ","ジュ","ʃ と同じ形で、声を出す","c"],
  ["tʃ","チュ","唇を少し丸めて、「チュ」と息を出す","c"],
  ["dʒ","ヂュ","舌先を歯ぐきにつけてから「ジュ」","c"],
  ["h","ハ","のどから息だけを出す。ハ行の子音","c"],
  ["m","ム","唇を閉じて、鼻から声を出す","c"],
  ["n","ン","舌先を上の歯ぐきにつけて、鼻から声を出す","c"],
  ["ŋ","ング","舌の奥を上あごにつけて鼻から出す。最後の「グ」はほとんど言わない","c"],
  ["l","ル","舌先を上の歯ぐきにつける。語末では「オ」「ウ」に近く聞こえる","c"],
  ["r","ゥル","舌先をどこにもつけず奥へ丸め、唇も少し丸める","c"],
  ["w","ウ","唇を丸めて前に突き出し、そこから開く","c"],
  ["j","イ(ヤ行)","ヤ行の始まりの音。「ユ」「ヤ」の最初の部分","c"],
  ["ː","のばす","前の音を長くのばす","mark"]
];
const IPA_BY = new Map(IPA.map(x=>[x[0],x]));

function ipaTokens(str){
  const out=[]; let i=0;
  while(i<str.length){
    const k = IPA_KEYS.find(k=>str.startsWith(k,i));
    if(k){ out.push(IPA_BY.get(k)); i+=k.length; }
    else { const ch=str[i]; if(ch.trim() && ch!=="." ) out.push([ch,"",""]); i++; }
  }
  return out;
}
/* コースとレベル */
const COURSES = [
  {id:"jhs", name:"中学英語", levels:[["jhs1","中1"],["jhs2","中2"],["jhs3","中3"]]},

];
const TAG_LABEL = {}; COURSES.forEach(c=>c.levels.forEach(([id,l])=>{ TAG_LABEL[id] = (c.id==="jhs"? l : c.name+" "+l); }));

    links:(r[7]||[]).map(l=>({part:l[0], reading:l[1], tip:TIPS[l[2]]||""})), tags:(r[8]||"").split(/\s+/).filter(Boolean)};

WORD_DATA.forEach(r => { const e=makeEntry(r); if(!BY.has(e.key)){ DICT.push(e); BY.set(e.key, e); } });
/* AIで作った単語(このブラウザに保存) */
const CKEY = "tsunagaru-tango-custom-v1";
const GKEY = "tsunagaru-tango-gemini-v1";

}

/* ===== state & storage (this browser only) ===== */
const KEY = "tsunagaru-tango-v2";

const myWords = () => Object.entries(state.deck).sort((a,b)=>(a[1].t||0)-(b[1].t||0)).map(([k,v])=>Object.assign({}, BY.get(k), {learned:!!v.learned}));

/* ===== AI(Gemini)で単語データを作る ===== */
const AI_MODELS_FALLBACK = ["gemini-flash-latest","gemini-3.5-flash","gemini-2.5-flash"];
function aiPrompt(word){
  return `あなたはアメリカ英語の発音に詳しい英語教師です。日本人の学習者向けに、英単語または熟語「${word}」の学習データを作ってください。

ルール:
- word: 正しいつづり(熟語ならそのまま)。英語として存在しない場合は error に日本語で理由を書き、ほかは空にする。
- pos: 品詞を日本語で(名詞、動詞、形容詞、副詞、前置詞、熟語 など)。
- meaning: 日本語の主な意味を1〜3個、「、」区切りで短く。
- ipa: アメリカ英語の発音記号。スラッシュは付けない。次の記号だけを使う:
  æ ɑː ɑ ʌ ə ɚ ɝː ɪ iː i ʊ uː u e ɔː eɪ aɪ aʊ oʊ ɔɪ p b t t̬ d k ɡ f v θ ð s z ʃ ʒ tʃ dʒ h m n ŋ l r w j ˈ ˌ
  母音にはさまれて「ラ行」のように聞こえる t は t̬ と書く(water → ˈwɑːt̬ɚ)。熟語は単語の間に半角スペースを入れる。
- katakana: 実際に聞こえる音に近いカタカナ(例: water → ワーラー)。
- example: この語を使った短く自然な英文(5〜10語)。音のつながりが起きる部分を必ず含める。
- exampleJa: 例文の自然な日本語訳。
- exampleReading: 例文全体を、ネイティブが自然に話すときのつながった音でカタカナ表記。単語の間にスペースを入れない。
- links: 例文の中で音がつながる部分を1〜3個。part は example の中にそのまま含まれる文字列(大文字小文字も同じ)。reading はその部分のカタカナ。type は次のどれか:
  L=子音と母音がくっつく F=t/dがラ行になる D=語末の音を飲み込む N=nのあとのtが消える Y=youとくっついてチュ/ジュになる G=同じ音が1つになる H=hやthが消えてつながる W=to/for/and/ofなどが弱くなる`;
}
const AI_SCHEMA = {type:"OBJECT", properties:{
  word:{type:"STRING"}, pos:{type:"STRING"}, meaning:{type:"STRING"}, ipa:{type:"STRING"}, katakana:{type:"STRING"},
  example:{type:"STRING"}, exampleJa:{type:"STRING"}, exampleReading:{type:"STRING"},
  links:{type:"ARRAY", items:{type:"OBJECT", properties:{part:{type:"STRING"}, reading:{type:"STRING"}, type:{type:"STRING"}}, required:["part","reading","type"]}},
  error:{type:"STRING"}}, required:["word","pos","meaning","ipa","katakana","example","exampleJa","exampleReading","links"]};
class AIError extends Error{ constructor(msg){ super(msg); } }
async function callGemini(word){
  const models = [...new Set([state.model, ...AI_MODELS_FALLBACK].filter(Boolean))];
  let lastErr = null;
  for(const model of models){
    let res;
    try{
      res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
        method:"POST", headers:{"Content-Type":"application/json","x-goog-api-key":state.apiKey},
        body: JSON.stringify({contents:[{role:"user",parts:[{text:aiPrompt(word)}]}],
          generationConfig:{temperature:0.3, responseMimeType:"application/json", responseSchema:AI_SCHEMA}})
      });
    }catch(e){ throw new AIError("通信できませんでした。電波の状態を確かめてください。"); }
    if(res.status===404){ lastErr = new AIError(`モデル「${model}」が見つかりませんでした。`); continue; }
    if(res.status===400 || res.status===401 || res.status===403) throw new AIError("APIキーが正しくないか、使えない状態です。設定画面でキーを確かめてください。");
    if(res.status===429) throw new AIError("無料枠の回数上限に達しました。少し時間をおいてから試してください。");
    if(!res.ok) throw new AIError(`AIからエラーが返りました(${res.status})。時間をおいて試してください。`);
    const data = await res.json();
    const text = ((data.candidates||[])[0]?.content?.parts||[]).map(p=>p.text||"").join("");
    try{ return JSON.parse(text.replace(/```json|```/g,"").trim()); }
    catch(e){ throw new AIError("AIの返事を読み取れませんでした。もう一度作成してください。"); }
  }
  throw lastErr || new AIError("使えるモデルが見つかりませんでした。設定画面でモデル名を確かめてください。");
}
function aiToRow(o, asked){
  const s = v => typeof v==="string" ? v.trim() : "";
  if(s(o.error)) throw new AIError(s(o.error));
  const word = s(o.word) || asked;
  const example = s(o.example);
  const links = (Array.isArray(o.links)?o.links:[]).map(l=>[s(l&&l.part), s(l&&l.reading), s(l&&l.type).toUpperCase().slice(0,1)])
    .filter(l=>l[0] && l[1] && TIPS[l[2]] && example.includes(l[0])).slice(0,3);
  const ipa = s(o.ipa).replace(/^\/|\/$/g,"");
  if(!ipa || !s(o.meaning)) throw new AIError("AIの返事に必要な情報が足りませんでした。もう一度作成してください。");
  const row = [word, s(o.pos), s(o.meaning), ipa, example, s(o.exampleJa), s(o.exampleReading).replace(/\s+/g,""), links, "ai", ""];
  if(!KANA.convert(ipa)) row[9] = s(o.katakana);
  return row;
}
async function aiGenerate(word){
  if(!state.apiKey){ state.aiMsg="先に設定画面でAPIキーを登録してください。"; state.aiErr=true; renderFindArea(); return; }
  state.aiBusy=true; state.aiDraft=null; state.aiMsg=`AIが「${word}」のデータを作っています…`; state.aiErr=false; renderFindArea();
  try{
    const row = aiToRow(await callGemini(word), word);
    const e = makeEntry(row); e.custom=true; e._row=row;
    if(BY.has(e.key)){ state.aiMsg=`「${e.word}」はすでに入っています。上の一覧から追加できます。`; state.aiErr=false; state.q=e.word; }
    else { state.aiDraft=e; state.aiMsg=""; }
  }catch(err){ state.aiMsg = err instanceof AIError ? err.message : "作成できませんでした。もう一度試してください。"; state.aiErr=true; }
  finally{ state.aiBusy=false; renderFindArea(); }
}
function aiSaveDraft(){
  const e = state.aiDraft; if(!e) return;

  addCustomEntry(e._row);

  renderFindArea();
}

/* ===== helpers ===== */

/* ===== speech: American English voice on this phone ===== */
let voice=null;
function pickVoice(){
  if(!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang));
  const pref = ["Samantha","Google US English","Microsoft Aria","Microsoft Jenny","Ava","Allison","Alex"];
  voice = vs.find(v=>pref.some(p=>v.name.includes(p))) || vs[0] || null;
}

function speak(text){
  if(!("speechSynthesis" in window)){ toast("この端末では音声を再生できません"); return; }
  speechSynthesis.cancel();

/* ===== pieces ===== */
function highlight(example, links){
  let html = esc(example); const marks=[];
  [...new Set(links.map(l=>l.part))].sort((a,b)=>b.length-a.length).forEach((p,i)=>{
    const ep=esc(p); if(html.includes(ep)){ const k="\u0000"+i+"\u0000"; html=html.replace(ep,k); marks.push([k,ep]); }
  });
  marks.forEach(([k,ep])=>{ html=html.replace(k,"<mark>"+ep+"</mark>"); });
  return html;
}
function details(w, compact){
  return `
    ${compact?"":`<div class="w-small">${esc(w.word)}</div>`}
    <div class="reading">${esc(w.reading)}</div>
    ${w.ipa?ipaBlock(w.ipa):""}
    <p class="meaning"><small>${esc(w.pos)}</small>${esc(w.meaning)}</p>
    ${compact?"":`<div class="row"><button type="button" class="play" data-say="${esc(w.word)}">${SPK}単語を聞く</button></div>`}
    <div class="sec">
      <p class="ex">${highlight(w.example, w.links)}</p>
      <div class="ex-reading">${esc(w.exampleReading)}</div>
      <div class="ex-ja">${esc(w.exampleJa)}</div>
      <div class="row" style="margin-bottom:12px"><button type="button" class="play" data-say="${esc(w.example)}">${SPK}例文を聞く</button></div>
      ${w.links.length?`<ul class="links">${w.links.map(l=>`<li><div class="body"><span class="lk">${esc(l.part)}</span><span class="arrow">→</span><span class="lr">${esc(l.reading)}</span>${l.tip?`<span class="tip">${esc(l.tip)}</span>`:""}</div><button type="button" class="icon" data-say="${esc(l.part)}" aria-label="${esc(l.part)} を聞く">${SPK}</button></li>`).join("")}</ul>`:""}
    </div>`;
}

function ipaBlock(str){
  const toks = ipaTokens(str);
  const seen=new Set(); const tips=[];
  toks.forEach(t=>{ if(t[2] && !seen.has(t[0])){ seen.add(t[0]); tips.push(t); } });
  return `<div class="ipa">
    <div class="ipa-line"><span class="ipa-str">/${esc(str)}/</span></div>
    <ol class="ipa-tiles" aria-label="発音記号を1つずつ">${toks.map(t=>`<li class="${t[3]==="mark"?"mk":""}"><span class="sym">${esc(t[0])}</span><span class="kana">${esc(t[1])}</span></li>`).join("")}</ol>
    <details class="ipa-how"><summary>発音記号の読み方</summary>
      <ul>${tips.map(t=>`<li><span class="sym">${esc(t[0])}</span><span><b>${esc(t[1])}</b>${esc(t[2])}</span></li>`).join("")}</ul>
    </details>
  </div>`;
}

/* ===== views ===== */
function viewStudy(){
  const all = myWords();
  if(!all.length){
    return `<div class="empty"><p>単語帳はまだ空です。<br>「さがす」から覚えたい単語を追加しましょう。</p>
      <button type="button" class="primary" data-go="find">単語をさがす</button></div>`;
  }
  const list = deckList();
  const bar = `<div class="bar"><div class="chips" role="group" aria-label="出す単語">
      <button type="button" class="chip" data-filter="todo" aria-pressed="${state.filter==="todo"}">まだの単語</button>
      <button type="button" class="chip" data-filter="all" aria-pressed="${state.filter==="all"}">すべて</button></div>
      <span class="count">${list.length?(state.idx+1)+" / "+list.length:""}</span></div>`;
  if(!list.length){
    return bar+`<div class="empty"><p>単語帳の単語は全部「覚えた」になりました。<br>「すべて」で復習するか、新しい単語を追加しましょう。</p>
      <button type="button" class="primary" data-go="find">単語をさがす</button></div>`;
  }
  if(state.idx>=list.length) state.idx=list.length-1;
  const w = list[state.idx];
  return bar+`
  <div class="deck">
    <svg class="ring" viewBox="0 0 34 52" aria-hidden="true"><path d="M17 50 C4 50 4 30 4 18 C4 6 30 6 30 18 C30 26 26 30 21 32" fill="none" stroke="var(--ring)" stroke-width="3.2" stroke-linecap="round"/></svg>
    <div class="card ${state.flipped?"flipped":""}" id="card" role="button" tabindex="0" aria-label="カードをめくる">
      <div class="face front" aria-hidden="${state.flipped}">
        ${w.learned?`<span class="status-tag">覚えた</span>`:""}
        <div class="word">${esc(w.word)}</div>
        <div class="pos">${esc(w.pos)}</div>
        <button type="button" class="play" data-say="${esc(w.word)}">${SPK}聞く</button>
        <div class="hint">タップして読み方と例文を見る</div>
      </div>
      <div class="face back" aria-hidden="${!state.flipped}">${details(w,false)}</div>
    </div>
  </div>
  <div class="judge">
    <button type="button" data-judge="no">まだ</button>
    <button type="button" class="yes" data-judge="yes">覚えた</button>
  </div>
  <div class="navbtns">
    <button type="button" data-step="-1" ${state.idx===0?"disabled":""}>‹ 前へ</button>
    <button type="button" data-step="1" ${state.idx>=list.length-1?"disabled":""}>次へ ›</button>
  </div>`;
}
function findMatches(){
  const q = state.q.trim().toLowerCase();
  return DICT.filter(e => (q ? true : e.tags.includes(state.level)) &&
    (!q || e.key.includes(q) || e.meaning.includes(state.q.trim()) || e.reading.includes(state.q.trim())));
}
function tagBadges(e){
  return e.tags.length ? `<span class="tags">${e.tags.map(t=>`<i>${esc(TAG_LABEL[t]||t)}</i>`).join("")}</span>` : "";
}
function rowFind(e){
  const added = !!state.deck[e.key];
  return `<li><details><summary class="item">
      <button type="button" class="icon" data-say="${esc(e.word)}" aria-label="${esc(e.word)} を聞く">${SPK}</button>
      <div class="lw"><b>${esc(e.word)}</b><span>${esc(e.reading)}・${esc(e.meaning)}</span>${e.tags.length>1?tagBadges(e):""}</div>
      <button type="button" class="add ${added?"added":""}" data-add="${esc(e.key)}" ${added?'aria-disabled="true"':""}>${added?"追加済み":"＋ 追加"}</button>
      ${e.custom?`<button type="button" class="icon" data-aidel="${esc(e.key)}" aria-label="${esc(e.word)} を削除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>`:""}
    </summary><div class="detail">${details(e,true)}</div></details></li>`;
}
function findArea(){
  const m = findMatches();
  const notAdded = m.filter(e=>!state.deck[e.key]).length;
  const shown = m.slice(0, state.findShown);
  const qq = state.q.trim();
  const course = COURSES.find(c=>c.id===state.course);
  const isEn = /^[A-Za-z][A-Za-z' -]{0,40}$/.test(qq);
  const showAI = qq && isEn && !BY.has(qq.toLowerCase());
  const aiBox = (showAI || state.aiDraft || state.aiMsg) ? `<div class="ai-box">
    ${state.aiDraft ? `<p><b>AIが作った「${esc(state.aiDraft.word)}」</b>(内容をよく確かめてから保存してください)</p>
      <div class="ai-preview">${details(state.aiDraft,false)}</div>
      <div class="btns"><button type="button" class="primary" id="aiSave">保存して単語帳に追加</button><button type="button" class="ghost" id="aiRetry">作り直す</button><button type="button" class="ghost" id="aiCancel">やめる</button></div>`
    : state.aiBusy ? `<p>${esc(state.aiMsg)}</p>`
    : `${state.aiMsg?`<p class="${state.aiErr?"err":""}">${esc(state.aiMsg)}</p>`:""}
      ${showAI ? (state.apiKey
        ? `<p>「${esc(qq)}」は内蔵データにありません。AIで読み方・意味・例文を作れます。</p><div class="btns"><button type="button" class="primary" id="aiGen">AIで「${esc(qq)}」を作成</button></div>`
        : `<p>「${esc(qq)}」は内蔵データにありません。AI機能を使うと作成できます。</p><div class="btns"><button type="button" class="ghost" data-go="settings">AIの設定をする</button></div>`) : ""}`}
  </div>` : "";
  return `${aiBox}
  <div class="courses" role="group" aria-label="コース">
    ${COURSES.map(c=>{const n=courseCount(c);return `<button type="button" class="course" data-course="${c.id}" aria-pressed="${!qq&&state.course===c.id}"><b>${c.name}</b><span>${n?n+"語":(c.id==="ai"?"0語":"準備中")}</span></button>`}).join("")}
  </div>
  <div class="bar">
    <div class="chips" role="group" aria-label="レベル">
      ${course.levels.map(([id,l])=>{const n=levelCount(id);return `<button type="button" class="chip" data-level="${id}" aria-pressed="${!qq&&state.level===id}" ${n?"":"disabled"}>${l}${n?"":"(準備中)"}</button>`}).join("")}
    </div>
  </div>
  <div class="bulk"><span>${qq?`${m.length}語が見つかりました`:`${TAG_LABEL[state.level]}・${m.length}語`}</span>
    ${m.length?`<button type="button" id="bulkAdd" ${notAdded?"":"disabled"}>${notAdded?`まだの${notAdded}語をまとめて追加`:"すべて追加済み"}</button>`:""}</div>
  ${m.length?`<ul class="list">${shown.map(rowFind).join("")}</ul>
    ${m.length>shown.length?`<button type="button" class="ghost more" id="more">もっと見る(残り${m.length-shown.length}語)</button>`:""}`
   :qq?(showAI?"":`<div class="empty"><p>「${esc(state.q)}」に合う単語は内蔵データにありません。<br>英単語で入力すると、AIで作成できます。</p></div>`)
   :state.level==="ai"?`<div class="empty"><p>AIで作った単語はまだありません。<br>上の検索欄に英単語を入れると作成できます。</p></div>`
   :`<div class="empty"><p>このレベルの単語は準備中です。</p></div>`}`;
}
function viewFind(){
  return `<input type="search" id="q" placeholder="英単語か日本語でさがす" value="${esc(state.q)}" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="単語をさがす">

function render(){
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-current", b.dataset.tab===state.tab?"page":"false"));
  document.querySelectorAll(".speed button").forEach(b=>b.setAttribute("aria-pressed", String(Number(b.dataset.rate)===state.rate)));
  $view.innerHTML = state.tab==="study"?viewStudy():state.tab==="find"?viewFind():state.tab==="mine"?viewMine():viewSettings();
  if(state.tab==="find"){
    const q=document.getElementById("q");
    const upd=()=>{ state.q=q.value; state.findShown=60; if(!state.aiBusy && !state.aiDraft){ state.aiMsg=""; } renderFindArea(); };
    q.addEventListener("input", e=>{ if(!e.isComposing) upd(); });
    q.addEventListener("compositionend", upd);
  }
}
/* update only the find list rows' add buttons, keep scroll/open state */
function refreshAddButtons(){
  document.querySelectorAll("[data-add]").forEach(b=>{ const on=!!state.deck[b.dataset.add]; b.classList.toggle("added",on); b.textContent=on?"追加済み":"＋ 追加"; if(on) b.setAttribute("aria-disabled","true"); });
  const m=findMatches(); const n=m.filter(e=>!state.deck[e.key]).length; const bb=document.getElementById("bulkAdd");
  if(bb){ bb.disabled=!n; bb.textContent=n?`まだの${n}語をまとめて追加`:"すべて追加済み"; }
}

/* ===== backup ===== */
function exportData(){
  const data = JSON.stringify({app:"tsunagaru-tango", v:3, exportedAt:new Date().toISOString(), deck:state.deck, custom:CUSTOM}, null, 1);
  const name = "tango-backup-"+new Date().toISOString().slice(0,10)+".json";
  try{
    const file = new File([data], name, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){ navigator.share({files:[file], title:name}).catch(()=>{}); return; }
  }catch(e){}
  try{
    const url = URL.createObjectURL(new Blob([data],{type:"application/json"}));
    const a = document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000); toast("書き出しました");
  }catch(e){ toast("書き出せませんでした"); }
}
function importData(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const o = JSON.parse(r.result);
      if(!o || o.app!=="tsunagaru-tango" || typeof o.deck!=="object") throw 0;
      let nc=0;
      if(Array.isArray(o.custom)) for(const r of o.custom){ if(Array.isArray(r) && typeof r[0]==="string" && !BY.has(r[0].toLowerCase())){ if(addCustomEntry(r)){ CUSTOM.push(r); nc++; } } }
      if(nc) saveCustom();
      let n=0; const next={};
      for(const [k,v] of Object.entries(o.deck)){ if(BY.has(k)){ next[k]={learned:!!(v&&v.learned), t:(v&&v.t)||Date.now()}; n++; } }
      if(!confirm(`${n}語の記録を読み込みます。今の単語帳は置きかわります。よろしいですか?`)) return;
      state.deck=next; state.idx=0; save(); render(); toast(`${n}語を読み込みました`);
    }catch(e){ toast("このファイルは読み込めません。書き出したバックアップを選んでください"); }
  };
  r.readAsText(file);
}
document.getElementById("importFile").addEventListener("change", e=>{ const f=e.target.files&&e.target.files[0]; if(f) importData(f); e.target.value=""; });

/* ===== events ===== */
document.addEventListener("click", e=>{
  if(e.target.closest(".ipa-how")) return;
  const t = e.target.closest("button,#card"); if(!t) return;
  if(t.dataset.say!==undefined){ e.preventDefault(); e.stopPropagation(); speak(t.dataset.say); return; }
  if(t.dataset.add!==undefined){ e.preventDefault(); e.stopPropagation();
    const k=t.dataset.add; if(state.deck[k]) return; state.deck[k]={learned:false,t:Date.now()}; save(); refreshAddButtons(); toast(`「${BY.get(k).word}」を追加しました`); return; }
  if(t.dataset.tab){ state.tab=t.dataset.tab; state.flipped=false; render(); window.scrollTo(0,0); return; }
  if(t.dataset.go){ state.tab=t.dataset.go; render(); window.scrollTo(0,0); return; }
  if(t.dataset.rate){ state.rate=Number(t.dataset.rate); save(); render(); return; }
  if(t.dataset.filter){ state.filter=t.dataset.filter; state.idx=0; state.flipped=false; render(); return; }
  if(t.dataset.course){ const c=COURSES.find(c=>c.id===t.dataset.course); state.course=c.id;
    state.level=(c.levels.find(([id])=>levelCount(id))||c.levels[0])[0]; state.q=""; state.findShown=60; save(); render(); return; }
  if(t.dataset.level){ state.level=t.dataset.level; state.q=""; state.findShown=60; save(); render(); return; }
  if(t.id==="more"){ state.findShown+=100; renderFindArea(); return; }
  if(t.id==="bulkAdd"){ const m=findMatches().filter(x=>!state.deck[x.key]); if(!m.length) return;
    if(!confirm(`${m.length}語をまとめて単語帳に追加しますか?`)) return;
    const now=Date.now(); m.forEach((x,i)=>{ state.deck[x.key]={learned:false,t:now+i}; }); save(); refreshAddButtons(); toast(`${m.length}語を追加しました`); return; }
  if(t.id==="card"){ state.flipped=!state.flipped; t.classList.toggle("flipped",state.flipped);
    t.querySelector(".front").setAttribute("aria-hidden",state.flipped); t.querySelector(".back").setAttribute("aria-hidden",!state.flipped); return; }
  if(t.dataset.step){ const n=deckList().length; state.idx=Math.max(0,Math.min(n-1,state.idx+Number(t.dataset.step))); state.flipped=false; render(); return; }
  if(t.dataset.judge){
    const list=deckList(); const w=list[state.idx]; if(!w) return;
    const learned = t.dataset.judge==="yes";
    state.deck[w.key].learned = learned; save();
    if(!(state.filter==="todo" && learned)) state.idx = Math.min(state.idx+1, Math.max(0,deckList().length-1));
    state.flipped=false; render(); return;
  }
  if(t.dataset.toggle){ const d=state.deck[t.dataset.toggle]; if(!d) return; d.learned=!d.learned; save(); render(); return; }
  if(t.dataset.remove){ const w=BY.get(t.dataset.remove); if(!w) return;
    if(!confirm(`「${w.word}」を単語帳から外しますか?(記録も消えます)`)) return;
    delete state.deck[w.key]; state.idx=0; save(); render(); toast("単語帳から外しました"); return; }
  if(t.id==="exportBtn"){ exportData(); return; }
  if(t.id==="importBtn"){ document.getElementById("importFile").click(); return; }
  if(t.id==="aiGen"){ aiGenerate(state.q.trim()); return; }
  if(t.id==="aiRetry"){ const w=state.aiDraft?state.aiDraft.word:state.q.trim(); aiGenerate(w); return; }
  if(t.id==="aiCancel"){ state.aiDraft=null; state.aiMsg=""; renderFindArea(); return; }
  if(t.id==="aiSave"){ aiSaveDraft(); return; }
  if(t.dataset.aidel){ e.preventDefault(); e.stopPropagation(); const w=BY.get(t.dataset.aidel); if(!w) return;
    if(!confirm(`AIで作った「${w.word}」を削除しますか?(単語帳からも外れます)`)) return;
    removeCustom(w.key); renderFindArea(); toast("削除しました"); return; }
  if(t.id==="aiKeySave"){
    const kv=document.getElementById("apiKeyIn").value.trim(), mv=document.getElementById("modelIn").value.trim();
    if(kv) state.apiKey=kv; state.model=mv;
    try{ localStorage.setItem(GKEY, JSON.stringify({key:state.apiKey, model:state.model})); toast(state.apiKey?"保存しました":"モデル名を保存しました"); }catch(err){ toast("保存できませんでした"); }
    render(); return; }
  if(t.id==="aiKeyDel"){ if(!confirm("APIキーを削除しますか?")) return; state.apiKey="";
    try{ localStorage.setItem(GKEY, JSON.stringify({key:"", model:state.model})); }catch(err){} render(); toast("削除しました"); return; }
  if(t.id==="resetBtn"){ if(!confirm("単語帳と記録を全部消します。元に戻せません。よろしいですか?")) return;
    state.deck={}; state.idx=0; save(); render(); toast("単語帳を空にしました"); return; }
});
document.addEventListener("keydown", e=>{
  if(e.target.id==="card" && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); e.target.click(); }
});
let sx=null, sy=null;
document.addEventListener("touchstart",e=>{ if(e.target.closest("#card")){ sx=e.touches[0].clientX; sy=e.touches[0].clientY; } },{passive:true});
document.addEventListener("touchend",e=>{
  if(sx===null) return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5){ const n=deckList().length; const ni=Math.max(0,Math.min(n-1,state.idx+(dx<0?1:-1))); if(ni!==state.idx){ state.idx=ni; state.flipped=false; render(); } }
},{passive:true});

load(); render();
})();
</script>
</body>
</html>
